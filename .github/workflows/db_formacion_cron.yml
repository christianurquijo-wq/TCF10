# TCF10 · Actualización automática de la DB Formación (Cohorte 1 y Cohorte 2), lunes a sábado a las 7:05 a. m.
# (hora de Colombia), cuando el SIS ya trae el día anterior.
# Corre el mismo script que el botón del Panel (scripts/actualizar_db_formacion.py) con la bitácora de ops_logger.py:
# cada ejecución queda en LOG_EJECUCIONES y, si falla, llega la alerta. Comparte el grupo de concurrencia con
# ops_run_script.yml: si el Panel y el cron coinciden, uno espera al otro.
name: TCF10 · DB Formación (L-S 7:05 a. m.)

on:
  schedule:
    # GitHub usa hora UTC (Colombia = UTC-5): 12:05 UTC = 7:05 a. m. en Colombia.
    - cron: "5 12 * * 1-6"
  workflow_dispatch: {}

concurrency:
  group: ops-scripts/actualizar_db_formacion.py
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt google-auth requests

      - name: Restaurar archivos secretos
        env:
          SECRETS_BUNDLE: ${{ secrets.SECRETS_BUNDLE }}
        run: |
          if [ -z "$SECRETS_BUNDLE" ]; then echo "::error::SECRETS_BUNDLE no configurado"; exit 1; fi
          echo "$SECRETS_BUNDLE" | base64 -d > "$RUNNER_TEMP/s.zip"
          unzip -oq "$RUNNER_TEMP/s.zip" -d .
          rm -f "$RUNNER_TEMP/s.zip"

      - name: Actualizar con bitácora
        env:
          OPS_ORIGEN: cron
          OPS_ACTOR: github-cron
          OPS_SHEET_ID: ${{ secrets.OPS_SHEET_ID }}
          OPS_LOG_SA_JSON: ${{ secrets.OPS_LOG_SA_JSON }}
          OPS_ALERT_WEBHOOK: ${{ secrets.OPS_ALERT_WEBHOOK }}
          OPS_ALERT_TOKEN: ${{ secrets.OPS_ALERT_TOKEN }}
        run: python ops_logger.py --script "scripts/actualizar_db_formacion.py" --cwd root --timeout 25
